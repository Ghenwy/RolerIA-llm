[project]
name = "nyx-fallback"
version = "0.0.0"
description = "Fallback degradado y validadores de contratos para Nyx RPG local"
requires-python = ">=3.10,<3.14"
dependencies = [
  "jsonschema>=4.25,<5",
  "pydantic>=2.12,<3"
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.35,<1",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5"
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyx_fallback"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nyx_fallback"]
mypy_path = "fallback/python/src"

[[tool.mypy.overrides]]
module = "nyx_fallback.generated.*"
ignore_errors = true
